name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check version tag
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)"
      - name: Tests
        run: bash scripts/test.sh
      - name: Build and package
        run: bash scripts/package.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/release-notes.sh > dist/RELEASE_NOTES.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Codex Usage $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
